name: CI

# CI pull request workflow.
# Trigger su pull_request + push branches main/master.
# Esegue lint, typecheck, test su frontend + backend + Rust.
# Build Rust matrix sui 3 OS (lint/test single platform per velocita').

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-frontend:
    name: Lint frontend (pnpm + tsc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm run lint
      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck

  lint-backend:
    name: Lint backend (ruff + mypy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras
      - name: Ruff (lint)
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff (format check)
        working-directory: backend
        run: uv run ruff format --check .
      - name: Mypy (typecheck)
        working-directory: backend
        run: uv run mypy sco_compliance_os

  test-frontend:
    name: Test frontend (vitest)
    runs-on: ubuntu-22.04
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: frontend
        run: pnpm run test -- --run

  test-backend:
    name: Test backend (pytest ${{ matrix.platform }})
    needs: lint-backend
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras
      # Test suite unit (rapida) — esegue tutto fuori da tests/integration/.
      # NB: pytest "not integration" filter via path: tests/ esclude integration via --ignore.
      - name: Pytest unit
        working-directory: backend
        run: uv run pytest -q --ignore=tests/integration
      # Conv. 46 enforcement: integration test E2E su 3 OS per PR validation,
      # con HTML report uploadato come artifact per traceability.
      # Conv. 44 lesson 3 preserved: matrix copre Windows + macOS + Linux.
      - name: Pytest integration (Conv. 46 gate)
        working-directory: backend
        env:
          SCO_SEAL_SCHEDULER_ENABLED: "0"
          SCO_AUTO_FETCH_ENABLED: "0"
        run: |
          uv run pytest tests/integration/ -v --tb=short \
            --html=test-report-${{ matrix.platform }}.html --self-contained-html \
            --junitxml=junit-integration-${{ matrix.platform }}.xml
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report-${{ matrix.platform }}-${{ github.sha }}
          path: |
            backend/test-report-${{ matrix.platform }}.html
            backend/junit-integration-${{ matrix.platform }}.xml
          retention-days: 14

  build-rust:
    name: Build Rust (${{ matrix.platform }})
    needs: [lint-frontend, lint-backend]
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # Linux: deps GTK/WebKit per Tauri 2
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev
      # Placeholder sidecar binaries: tauri.conf.json ha externalBin che
      # punta al backend PyInstaller-built. In CI il sidecar reale viene
      # buildato solo nel workflow Release. Per cargo check/clippy bastano
      # placeholder empty file con i nomi corretti (Tauri verifica esistenza,
      # non contenuto). Conv. 44 lesson 3 enforcement: tutti i Rust target
      # triple coperti per la matrix CI.
      - name: Create placeholder sidecar binaries (CI only)
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          touch frontend/src-tauri/binaries/sco-compliance-os-backend-x86_64-pc-windows-msvc.exe
          touch frontend/src-tauri/binaries/sco-compliance-os-backend-aarch64-apple-darwin
          touch frontend/src-tauri/binaries/sco-compliance-os-backend-x86_64-apple-darwin
          touch frontend/src-tauri/binaries/sco-compliance-os-backend-x86_64-unknown-linux-gnu
          chmod +x frontend/src-tauri/binaries/sco-compliance-os-backend-* || true
      - name: Cargo fmt
        working-directory: frontend/src-tauri
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        working-directory: frontend/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Cargo check
        working-directory: frontend/src-tauri
        run: cargo check --all-targets --all-features
